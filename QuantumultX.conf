# ============================================================
# Quantumult X 配置（公开版，不含任何个人订阅链接）
# 仓库：https://github.com/yyloveyouu/quantumultx-config
# 本文件远程地址：https://raw.githubusercontent.com/yyloveyouu/quantumultx-config/main/QuantumultX.conf
# 用法见仓库 README.md。订阅请在 QX 本地添加，不要写进本文件。
# ============================================================

[general]
server_check_url = http://www.gstatic.com/generate_204
resource_parser_url = https://raw.githubusercontent.com/KOP-XIAO/QuantumultX/master/Scripts/resource-parser.js

[dns]
server = 223.5.5.5
server = 119.29.29.29
doh-server = https://dns.alidns.com/dns-query

[policy]
url-latency-benchmark = 自动选择, server-tag-regex=.*, check-interval=900, tolerance=0
static = 代理选择, 自动选择, direct, reject, server-tag-regex=.*

[server_local]

[server_remote]
# 不要在这里填订阅链接（本文件在公开仓库里，任何人可见）。
# 导入配置后，在 Quantumult X 里本地添加你自己的订阅（远程节点资源）。

[filter_remote]
https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/QuantumultX/AdvertisingLite/AdvertisingLite.list, tag=广告拦截, force-policy=reject, update-interval=172800, opt-parser=false, enabled=true
https://raw.githubusercontent.com/yyloveyouu/quantumultx-config/main/rules/custom-direct.list, tag=自定义直连, force-policy=direct, update-interval=172800, opt-parser=false, enabled=true
https://raw.githubusercontent.com/yyloveyouu/quantumultx-config/main/rules/custom-proxy.list, tag=自定义代理, force-policy=代理选择, update-interval=172800, opt-parser=false, enabled=true
https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/QuantumultX/ChinaMedia/ChinaMedia.list, tag=国内流媒体, force-policy=direct, update-interval=172800, opt-parser=false, enabled=true
https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/QuantumultX/GlobalMedia/GlobalMedia.list, tag=全球流媒体, force-policy=代理选择, update-interval=172800, opt-parser=false, enabled=true
https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/QuantumultX/Netflix/Netflix.list, tag=Netflix, force-policy=代理选择, update-interval=172800, opt-parser=false, enabled=true
https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/QuantumultX/YouTube/YouTube.list, tag=YouTube, force-policy=代理选择, update-interval=172800, opt-parser=false, enabled=true
https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/QuantumultX/Telegram/Telegram.list, tag=Telegram, force-policy=代理选择, update-interval=172800, opt-parser=false, enabled=true
https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/QuantumultX/China/China.list, tag=国内直连, force-policy=direct, update-interval=172800, opt-parser=false, enabled=true
https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/QuantumultX/Global/Global.list, tag=全球代理, force-policy=代理选择, update-interval=172800, opt-parser=false, enabled=true

[filter_local]
ip-cidr, 192.168.0.0/16, direct
ip-cidr, 10.0.0.0/8, direct
ip-cidr, 172.16.0.0/12, direct
ip-cidr, 127.0.0.0/8, direct
geoip, cn, direct
final, 代理选择

[rewrite_local]

[task_local]

[mitm]
passphrase =
p12 =
skip_validating_cert = false
force_sni_domain_name = false
hostname = *.googlevideo.com, *.youtube.com, *.googleapis.com
